<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><style>body{background:transparent}.overlay{height:100vh;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:16px;text-align:center}.overlay .avatar{transform:scale(1.45);transform-origin:bottom;margin-bottom:48px}.caption{background:#101827e8;color:white;border:1px solid #ffffff33;border-radius:17px;padding:14px;max-width:95%;font-size:23px;line-height:1.5}.brand{color:white;background:#101827bb;border-radius:30px;padding:7px 15px;margin-top:10px}</style></head><body><div class="overlay"><div class="avatar"><div class="hair"></div><div class="face"><div class="brow"></div><div class="eyes"><i></i><i></i></div><div class="nose"></div><div id="mouth" class="mouth"></div></div><div class="shirt"></div></div><div id="caption" class="caption">สวัสดีครับทุกคน ยินดีต้อนรับเข้าสู่ไลฟ์ครับ</div><div class="brand">พี่ต้น • AI HOST</div></div><script>const c=new BroadcastChannel("thai-ai-live");c.onmessage=e=>{document.getElementById("caption").textContent=e.data.line;const m=document.getElementById("mouth");m.classList.add("talk");setTimeout(()=>m.classList.remove("talk"),1200)};</script></body></html>
